<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UvaImpostor DualVoice - Uvaldo Vargas G.</title>
    <style>
        :root {
            --primary: #a855f7; --secondary: #22d3ee; --danger: #f43f5e;
            --glass: rgba(255, 255, 255, 0.08);
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: radial-gradient(circle at top, #1e1b4b 0%, #0f172a 100%);
            color: white; margin: 0; display: flex;
            justify-content: center; align-items: center;
            min-height: 100vh; overflow: hidden; user-select: none;
        }

        .container { width: 90%; max-width: 420px; }
        .screen { display: none; flex-direction: column; animation: fadeIn 0.4s ease-out; }
        .active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        .header-box { display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 5px; }
        .uva-icon { width: 60px; height: 60px; filter: drop-shadow(0 0 12px var(--primary)); }

        h1 {
            font-size: 2.5rem; margin: 0;
            background: linear-gradient(to bottom, #ffffff, var(--primary));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            font-weight: 900;
        }

        .glass-card {
            background: var(--glass); backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 30px;
            padding: 20px; box-shadow: 0 25px 60px rgba(0,0,0,0.6); margin: 15px 0;
        }

        .btn {
            background: linear-gradient(135deg, var(--primary), #6d28d9);
            color: white; border: none; padding: 16px; border-radius: 18px;
            font-size: 1.1rem; font-weight: 800; cursor: pointer;
            text-transform: uppercase; width: 100%; margin-bottom: 10px; transition: 0.2s;
        }
        .btn:active { transform: scale(0.96); }

        .imp-selector { display: flex; gap: 10px; margin-bottom: 15px; justify-content: center; }
        .opt { 
            flex: 1; padding: 10px; border-radius: 12px; background: rgba(255,255,255,0.05); 
            border: 1px solid rgba(255,255,255,0.2); text-align: center; cursor: pointer; font-weight: bold;
        }
        .opt.selected { background: var(--danger); border-color: white; color: white; }

        .input-box {
            background: rgba(0,0,0,0.4); border: 2px solid rgba(255,255,255,0.1);
            border-radius: 15px; padding: 12px; color: white; font-size: 1rem;
            width: 100%; box-sizing: border-box; margin-bottom: 10px; outline: none;
        }

        #game-trigger {
            height: 180px; display: flex; align-items: center; justify-content: center;
            border: 2px dashed rgba(255,255,255,0.2); border-radius: 25px;
            cursor: pointer; background: rgba(255,255,255,0.02); text-align: center;
        }

        .word-secret { font-size: 2.2rem; font-weight: 900; color: var(--secondary); display: none; text-transform: uppercase; }
        .impostor-alert { color: var(--danger) !important; text-shadow: 0 0 20px var(--danger); font-size: 1.7rem; }
        
        .p-item { display: flex; justify-content: space-between; background: rgba(255,255,255,0.05); padding: 8px 15px; border-radius: 12px; margin-bottom: 5px; font-size: 0.9rem; }
        .signature-text { font-style: italic; font-size: 0.8rem; color: rgba(255, 255, 255, 0.3); text-align: center; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <!-- SETUP -->
        <div id="screen-setup" class="screen active">
            <div class="header-box">
                <svg class="uva-icon" viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="none" stroke="#a855f7" stroke-width="2"/><path d="M48 44c0 1.1-.9 2-2 2H18c-1.1 0-2-.9-2-2v-4c0-4.4 3.6-8 8-8h16c4.4 0 8 3.6 8 8v4z" fill="#a855f7"/><path d="M32 16c-4.4 0-8 3.6-8 8v6h16v-6c0-4.4-3.6-8-8-8z" fill="#7c3aed"/><rect x="22" y="30" width="20" height="4" rx="2" fill="#fff"/></svg>
                <h1>UvaImpostor</h1>
            </div>
            
            <div class="glass-card">
                <p style="margin:0 0 10px 0; font-size: 0.8rem; opacity: 0.7; text-align: center;">CANTIDAD DE IMPOSTORES</p>
                <div class="imp-selector">
                    <div class="opt selected" id="opt1" onclick="setImpCount(1)">1</div>
                    <div class="opt" id="opt2" onclick="setImpCount(2)">2</div>
                </div>

                <input type="text" id="player-name" class="input-box" placeholder="Nombre...">
                <button class="btn" onclick="addPlayer()">+ Añadir</button>
                <div id="list-display" style="max-height:100px; overflow-y:auto;"></div>
            </div>

            <button class="btn" id="start-btn" style="display:none; background: var(--secondary); color: #0f172a;" onclick="initGame()">Iniciar Misión</button>
            <div class="signature-text"><h2>Diseñado por Uvaldo Vargas G.</h2></div>
        </div>

        <!-- JUEGO -->
        <div id="screen-game" class="screen">
            <h2 id="turn-title" style="text-align:center; color: var(--secondary); font-size:1.8rem;">Jugador</h2>
            <div class="glass-card" id="game-trigger" onclick="toggleSecret()">
                <div id="secret-word" class="word-secret">PALABRA</div>
                <p id="card-instr" style="font-size:1rem; font-weight:bold; opacity:0.7">TOCA AQUÍ PARA REVELAR LA PALABRA</p>
            </div>
            <button class="btn" id="next-btn" style="visibility:hidden" onclick="nextRole()">Siguiente Jugador</button>
        </div>

        <!-- RESULTADO -->
        <div id="screen-action" class="screen">
            <h1 style="text-align:center">¡LISTOS!</h1>
            <div class="glass-card" style="text-align:center">
                <p style="opacity:0.7">Inicia el análisis:</p>
                <h2 id="starter-name" style="font-size:2.3rem; color:var(--secondary); margin:10px 0;"></h2>
                <p id="info-msg" style="color:var(--danger); font-weight:bold;"></p>
            </div>
            <button class="btn" onclick="initGame()">Nueva Ronda</button>
            <button class="btn" style="background:transparent; border:1px solid rgba(255,255,255,0.2)" onclick="showScreen('screen-setup')">Agregar Jugadores</button>
        </div>
    </div>

e", "Ufano", "Ujier", "Úlcera", "Última", "Último", "Ultra", "Ultrasonido", "Umbral", "Unánime", "Unción", "Unidad", "Unido", "Uniforme", "Unión", "Unipersonal", "Unir","Untar", "Uranio", "Urbe", "Urgencia", "Urgente", "Urna", "Urraca", "Usado", "Usanza", "Usar", "Uso", "Usted", "Usuario", "Usura", "Utensilio", "Útil", "Utilidad", "Utopía", "Unísono", "Unidad", "Universo", "Uno", "Escalera"];
        
        let playersMaster = JSON.parse(localStorage.getItem('uvaPlayers')) || [];
        let gameQueue = [], currentIndex = 0, currentWord = "", impostores = [], selectedImpCount = 1;
        
        // Manejo de voces
        let maleVoices = [], femaleVoices = [];
        let voiceTurn = 0; // 0 para Femenina, 1 para Masculina

        function loadVoices() {
            const voices = window.speechSynthesis.getVoices();
            // Filtrar voces en español (es) y clasificarlas
            const esVoices = voices.filter(v => v.lang.startsWith('es'));
            
            femaleVoices = esVoices.filter(v => v.name.includes('Paulina') || v.name.includes('Sabina') || v.name.includes('Monica') || v.name.includes('Helena') || v.name.includes('Zira') || v.name.includes('Female'));
            maleVoices = esVoices.filter(v => v.name.includes('Raul') || v.name.includes('Pablo') || v.name.includes('David') || v.name.includes('Male'));
            
            // Si no encuentra específicas, reparte las que haya
            if(femaleVoices.length === 0) femaleVoices = [esVoices[0]];
            if(maleVoices.length === 0) maleVoices = [esVoices[esVoices.length - 1]];
        }

        window.speechSynthesis.onvoiceschanged = loadVoices;

        function speakIntercalated(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                // Intercalar voces: una vez femenina, una vez masculina
                const voiceList = (voiceTurn % 2 === 0) ? femaleVoices : maleVoices;
                utterance.voice = voiceList[0] || null;
                utterance.lang = 'es-MX';
                window.speechSynthesis.speak(utterance);
                voiceTurn++; // Cambia para el siguiente nombre
            }
        }

        function setImpCount(num) {
            selectedImpCount = num;
            document.querySelectorAll('.opt').forEach(el => el.classList.remove('selected'));
            document.getElementById('opt' + num).classList.add('selected');
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function addPlayer() {
            const input = document.getElementById('player-name');
            const name = input.value.trim();
            if (name && !playersMaster.includes(name)) {
                playersMaster.push(name);
                localStorage.setItem('uvaPlayers', JSON.stringify(playersMaster));
                input.value = "";
                renderPlayers();
            }
        }

        function removePlayer(name) {
            playersMaster = playersMaster.filter(p => p !== name);
            localStorage.setItem('uvaPlayers', JSON.stringify(playersMaster));
            renderPlayers();
        }

        function renderPlayers() {
            const list = document.getElementById('list-display');
            list.innerHTML = playersMaster.map(p => `
                <div class="p-item"><span>${p}</span><span onclick="removePlayer('${p}')" style="color:red; cursor:pointer;">✕</span></div>
            `).join('');
            document.getElementById('start-btn').style.display = playersMaster.length >= 3 ? 'block' : 'none';
        }

        function initGame() {
            if (selectedImpCount === 2 && playersMaster.length < 4) {
                alert("Mínimo 4 jugadores para 2 impostores.");
                return;
            }

            currentWord = wordsDB[Math.floor(Math.random() * wordsDB.length)];
            gameQueue = [...playersMaster].sort(() => Math.random() - 0.5);
            currentIndex = 0;
            voiceTurn = 0; // Reiniciar turno de voz en cada ronda

            const shuffled = [...gameQueue].sort(() => Math.random() - 0.5);
            impostores = shuffled.slice(0, selectedImpCount);

            showScreen('screen-game');
            updateUI();
        }

        function updateUI() {
            document.getElementById('turn-title').innerText = gameQueue[currentIndex];
            document.getElementById('secret-word').style.display = 'none';
            document.getElementById('card-instr').style.display = 'block';
            document.getElementById('next-btn').style.visibility = 'hidden';
            speakIntercalated(gameQueue[currentIndex]);
        }

        function toggleSecret() {
            const wordEl = document.getElementById('secret-word');
            const instrEl = document.getElementById('card-instr');
            const isImp = impostores.includes(gameQueue[currentIndex]);

            if (isImp) {
                wordEl.innerText = "¡ERES EL IMPOSTOR!";
                wordEl.classList.add('impostor-alert');
                if(navigator.vibrate) navigator.vibrate([100, 50, 100]); 
            } else {
                wordEl.innerText = currentWord;
                wordEl.classList.remove('impostor-alert');
            }

            wordEl.style.display = 'block';
            instrEl.style.display = 'none';
            document.getElementById('next-btn').style.visibility = 'visible';
        }

        function nextRole() {
            currentIndex++;
            if (currentIndex < gameQueue.length) {
                updateUI();
            } else {
                const starter = gameQueue[Math.floor(Math.random() * gameQueue.length)];
                document.getElementById('starter-name').innerText = starter;
                document.getElementById('info-msg').innerText = impostores.length + (impostores.length > 1 ? " IMPOSTORES" : " IMPOSTOR");
                showScreen('screen-action');
                speakIntercalated("Empieza " + starter);
            }
        }

        window.onload = () => {
            renderPlayers();
            loadVoices();
        };
    </script>
